<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>更新历史 · 音频分割工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23007bff' d='M4 12a8 8 0 1 1 16 0h-1a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-5a10 10 0 0 0-20 0v5a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2z'/></svg>">
<style>
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f0f0f2;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --border: #d2d2d7;
  --primary: #007aff;
  --primary-hover: #0062cc;
  --primary-light: #e8f0fe;
  --success: #34c759;
  --danger: #ff3b30;
  --purple: #af52de;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme=dark] {
  --bg: #1c1c1e;
  --surface: #2c2c2e;
  --surface2: #3a3a3c;
  --text: #f5f5f7;
  --text2: #a1a1a6;
  --border: #48484a;
  --primary: #0a84ff;
  --primary-hover: #409cff;
  --primary-light: #1c3a5e;
  --purple: #bf5af2;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
  scrollbar-gutter: stable;
  transition: background .3s, color .3s;
  -webkit-user-select: none; user-select: none;
}

.container { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; color: var(--text); }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 50%;
  width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .25s, transform .25s; color: var(--text);
}
.theme-btn:hover { background: var(--border); transform: rotate(20deg) scale(1.05); }
.theme-btn:active { transform: rotate(20deg) scale(.95); }

.subtitle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.subtitle { font-size: .85rem; color: var(--text2); }
.copy-btn {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  color: var(--text2); font-size: .78rem; padding: 3px 14px; cursor: pointer;
  transition: .2s; font-family: inherit; line-height: 1.5;
}
.copy-btn:hover { color: var(--primary); border-color: var(--primary); }

.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px; margin-bottom: 20px; border: 1px solid var(--border);
  transition: background .3s, border-color .3s, box-shadow .3s;
  animation: fadeUp .4s cubic-bezier(.2,.8,.2,1) backwards;
  -webkit-user-select: text; user-select: text;
}
.card:nth-of-type(2) { animation-delay: .06s; }
.card:nth-of-type(3) { animation-delay: .12s; }
.card:nth-of-type(4) { animation-delay: .18s; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.vver { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
.tag {
  font-size: .72rem; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  color: var(--primary); background: var(--primary-light);
}
.tag.outdated { color: var(--text2); background: var(--surface2); }
.vdate { margin-left: auto; font-size: .78rem; color: var(--text2); }

ul { list-style: none; }
li {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: .92rem;
}
li:last-child { border-bottom: none; }
li .ic {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center; font-size: .72rem; margin-top: 2px;
}
.ic.t-new { background: var(--primary); color: #fff; }
.ic.t-fix { background: var(--danger); color: #fff; }
.ic.t-opt { background: var(--success); color: #fff; }
.ic.t-ui  { background: var(--purple); color: #fff; }

.footer {
  display: flex; justify-content: center; gap: 20px; padding: 24px 0 16px;
  border-top: 1px solid var(--border); margin-top: 8px;
}
.footer a { color: var(--text2); transition: color .2s; text-decoration: none; display: flex; align-items: center; gap: 4px; }
.footer a:hover { color: var(--text); }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

::view-transition-old(root) { animation: none; z-index: 1; }
::view-transition-new(root) {
  animation: circle-in .8s ease-out both;
  z-index: 2;
}
@keyframes circle-in {
  from { clip-path: circle(0% at var(--click-x, 50%) var(--click-y, 50%)); }
  to { clip-path: circle(150% at var(--click-x, 50%) var(--click-y, 50%)); }
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>更新历史</h1>
  <button class="theme-btn" id="themeBtn" title="切换主题">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
</header>
<div class="subtitle-row">
  <span class="subtitle">音频分割工具 · 版本迭代记录</span>
  <button type="button" class="copy-btn" id="copyBtn" title="复制全部更新内容与时间">复制内容</button>
</div>

<div id="list"></div>

<footer class="footer">
  <a href="index.html" title="返回主页面">
    <svg viewBox="0 0 24 24" height="18" width="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    返回音频分割工具
  </a>
</footer>
</div>

<script>
var HISTORY = [
  {
    ver: 'v1.4', date: '2026-08-03 · 最新', latest: true,
    items: [
      ['new', '运行日志默认隐藏，可点击「日志」按钮展开/收起（记住选择）'],
      ['opt', '「日志」「复制」按钮移至百分比旁边，进度条界面更紧凑'],
      ['ui',  '播放按钮加大，与下载按钮间距拉开'],
      ['new', '日志详细化：开头输出系统信息（版本、浏览器、系统、采样率等），全程记录读取/解码/混音/处理耗时'],
      ['opt', '自动捕获全局错误与异步异常到日志，出错时日志框自动展开'],
      ['new', '日志内容可选复制，一键复制全部日志'],
      ['opt', '动画性能优化：兼容低配设备与减少动态偏好（prefers-reduced-motion）'],
      ['new', '播放中卡片高亮、按钮按压反馈、上传图标浮动、主题按钮旋转等动效'],
      ['ui',  '界面美化：细滚动条、键盘焦点样式、卡片悬停上浮'],
      ['opt', '长列表渲染优化（content-visibility）']
    ]
  },
  {
    ver: 'v1.3', date: '2026-08-03', latest: false,
    items: [
      ['ui',  '所有 emoji 图标替换为 SVG 矢量图标，跟随主题与按钮状态变色'],
      ['fix', '修复移动端双指缩放（禁止触摸放大）'],
      ['new', '点击播放时自动滚动定位到屏幕 40% 位置']
    ]
  },
  {
    ver: 'v1.2', date: '2026-07-30', latest: false,
    items: [
      ['ui',  '更新提示横幅改为卷帘门式展开动画，开合更顺滑'],
      ['opt', '下方内容跟随横幅动画平滑下移/上移'],
      ['fix', '修复滚动条出现导致页面整体偏移的问题']
    ]
  }
];

var LABELS = { new: '新增', fix: '修复', opt: '优化', ui: '界面' };
var ICON_CLASS = { new: 't-new', fix: 't-fix', opt: 't-opt', ui: 't-ui' };
var ICONS = { new: '✚', fix: '✓', opt: '↗', ui: '✦' };

function render() {
  var list = document.getElementById('list');
  var html = '';
  for (var v = 0; v < HISTORY.length; v++) {
    var entry = HISTORY[v];
    html += '<div class="card">';
    html += '<div class="vhead">';
    html += '<span class="vver">' + entry.ver + '</span>';
    html += '<span class="tag' + (entry.latest ? '' : ' outdated') + '">' + (entry.latest ? '最新' : '历史版本') + '</span>';
    if (entry.date) html += '<span class="vdate">' + entry.date + '</span>';
    html += '</div><ul>';
    for (var i = 0; i < entry.items.length; i++) {
      var it = entry.items[i];
      html += '<li><span class="ic ' + ICON_CLASS[it[0]] + '" title="' + LABELS[it[0]] + '">' + ICONS[it[0]] + '</span><span>' + it[1] + '</span></li>';
    }
    html += '</ul></div>';
  }
  list.innerHTML = html;
}

function getTheme() {
  var s = localStorage.getItem('theme');
  if (s) return s;
  try { if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'; } catch(e) {}
  return 'light';
}
function apply(t) {
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('themeBtn');
  btn.innerHTML = t === 'dark'
    ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
}
document.getElementById('themeBtn').addEventListener('click', function(e) {
  var x = e.clientX, y = e.clientY;
  document.documentElement.style.setProperty('--click-x', x + 'px');
  document.documentElement.style.setProperty('--click-y', y + 'px');
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  try {
    if (document.startViewTransition) {
      document.startViewTransition(function() { apply(next); });
    } else {
      apply(next);
    }
  } catch(err) {
    apply(next);
  }
});
apply(getTheme());
render();

function buildCopyText() {
  var lines = [];
  for (var v = 0; v < HISTORY.length; v++) {
    var e = HISTORY[v];
    lines.push(e.ver + '  更新时间: ' + (e.date || ''));
    for (var i = 0; i < e.items.length; i++) lines.push('- ' + e.items[i][1]);
    lines.push('');
  }
  return lines.join('\n').trim();
}
function legacyCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  ta.remove();
  done(ok);
}
var copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', function() {
  var text = buildCopyText();
  function done(ok) {
    copyBtn.textContent = ok ? '已复制' : '复制失败';
    copyBtn.style.color = ok ? 'var(--success)' : 'var(--danger)';
    setTimeout(function() { copyBtn.textContent = '复制内容'; copyBtn.style.color = ''; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { done(true); })
      .catch(function() { legacyCopy(text, done); });
  } else {
    legacyCopy(text, done);
  }
});
</script>
</body>
</html>
